<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Offline PWA</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4285F4">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      background-color: #4285F4;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      margin-top: 10px;
    }
    button:hover { background-color: #3367D6; }
    
    #installAppBtn {
      background-color: #34A853; 
      font-weight: bold;
      display: none; 
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    
    /* New Manual Sync Button Styling */
    #manualSyncBtn {
      background-color: transparent;
      color: #4285F4;
      border: 1px solid #4285F4;
      margin-top: 15px;
      padding: 8px;
      font-size: 14px;
    }
    #manualSyncBtn:hover {
      background-color: #e8f0fe;
    }

    #syncStatusText {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
      color: #555;
    }
    #notesList {
      margin-top: 20px;
      text-align: left;
      width: 100%;
      max-height: 300px;
      overflow-y: auto;
    }
    .note-item {
      background: #eef2f5;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
      font-size: 14px;
      border-left: 4px solid #4285F4;
      display: flex;
      justify-content: space-between;
    }
    .cloud-icon { font-size: 12px; }
  </style>
</head>
<body>

  <button id="installAppBtn">📲 Install App to Homescreen</button>

  <div class="card">
    <h2>Fast Notes PWA</h2>
    <p style="font-size: 12px; color: gray;">Smart Event-Driven Sync Active</p>
    
    <input type="text" id="noteInput" placeholder="Type a note here...">
    <button onclick="handleSave()">Save Note</button>
    
    <button id="manualSyncBtn" onclick="manualSync()">🔄 Refresh Data</button>
    
    <div id="syncStatusText">Initializing App...</div>
    
    <div id="notesList">
      </div>
  </div>

  <script>
    // ==========================================
    // !!! PASTE YOUR GOOGLE APPS SCRIPT URL HERE !!!
    // ==========================================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx7pP3Qm4EMMdXX-m6lkO1wLHhfIqOvjOF80Qyrg4S0RtOYRH13FvUdOCFhjCYcAFAx/exec";

    // ==========================================
    // 1. PWA INSTALL LOGIC
    // ==========================================
    let deferredPrompt;
    const installBtn = document.getElementById('installAppBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt(); await deferredPrompt.userChoice;
        deferredPrompt = null; installBtn.style.display = 'none';
      }
    });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

    // ==========================================
    // 2. INDEXED-DB LOGIC
    // ==========================================
    let db;
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("GasAppDatabase", 2);
        request.onupgradeneeded = function(event) {
          const database = event.target.result;
          let store;
          if (!database.objectStoreNames.contains("notes")) {
            store = database.createObjectStore("notes", { keyPath: "id" });
          } else {
            store = event.target.transaction.objectStore("notes");
          }
          if (!store.indexNames.contains("syncStatus")) store.createIndex("syncStatus", "syncStatus", { unique: false });
          if (!store.indexNames.contains("timestamp")) store.createIndex("timestamp", "timestamp", { unique: false });
        };
        request.onsuccess = function(event) { db = event.target.result; resolve(); };
        request.onerror = function(event) { reject("IndexedDB Error"); };
      });
    }

    function idbOperation(mode, callback) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(["notes"], mode);
        const store = transaction.objectStore("notes");
        const request = callback(store);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    // ==========================================
    // 3. CORE APP LOGIC
    // ==========================================
    function generateID() {
      return Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 9);
    }

    window.onload = async () => {
      await initDB();
      await renderNotes(); 
      document.getElementById('syncStatusText').innerText = "App Ready.";
      
      // Initial fetch on load
      await syncDown(); 
      await syncUp();   
    };

    async function handleSave() {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();
      if (!text) return;

      const newNote = {
        id: generateID(),
        text: text,
        timestamp: Date.now(),
        syncStatus: 0 // Needs upload
      };

      await idbOperation("readwrite", store => store.put(newNote));
      input.value = "";
      await renderNotes();
      
      // Trigger sync up immediately after saving
      await syncUp();
    }

    async function renderNotes() {
      const notes = await idbOperation("readonly", store => store.getAll());
      notes.sort((a, b) => b.timestamp - a.timestamp); 
      
      const listElement = document.getElementById('notesList');
      listElement.innerHTML = notes.map(note => `
        <div class="note-item">
          <span>${note.text}</span>
          <span class="cloud-icon" title="Sync Status">${note.syncStatus === 1 ? '☁️ ✔' : '⏳'}</span>
        </div>
      `).join('');
    }

    // ==========================================
    // 4. DELTA SYNC ENGINE
    // ==========================================

    async function syncUp() {
      const allNotes = await idbOperation("readonly", store => store.getAll());
      const pendingNotes = allNotes.filter(n => n.syncStatus === 0);

      if (pendingNotes.length === 0) return;
      document.getElementById('syncStatusText').innerText = "Uploading data...";

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(pendingNotes)
        });
        const result = await response.json();

        if (result.status === 'success') {
          const transaction = db.transaction(["notes"], "readwrite");
          const store = transaction.objectStore("notes");
          pendingNotes.forEach(note => {
            note.syncStatus = 1;
            store.put(note);
          });
          document.getElementById('syncStatusText').innerText = "Notes uploaded successfully.";
          renderNotes(); 
        }
      } catch (error) {
        document.getElementById('syncStatusText').innerText = "Offline. Will sync later.";
      }
    }

    async function syncDown() {
      let cursor = parseInt(localStorage.getItem('cloudSyncCursor')) || 0;
      document.getElementById('syncStatusText').innerText = "Checking for updates...";

      try {
        const response = await fetch(`${WEB_APP_URL}?lastSync=${cursor}`);
        const result = await response.json();

        if (result.status === 'success' && result.data.length > 0) {
          const transaction = db.transaction(["notes"], "readwrite");
          const store = transaction.objectStore("notes");
          
          let highestNewTimestamp = cursor;

          result.data.forEach(note => {
            store.put(note); 
            if (note.timestamp > highestNewTimestamp) {
              highestNewTimestamp = note.timestamp;
            }
          });
          
          localStorage.setItem('cloudSyncCursor', highestNewTimestamp);
          
          document.getElementById('syncStatusText').innerText = "App is up to date.";
          renderNotes(); 
        } else {
          document.getElementById('syncStatusText').innerText = "App is up to date.";
        }
      } catch (error) {
         document.getElementById('syncStatusText').innerText = "Offline mode active.";
      }
    }

    async function manualSync() {
      if (navigator.onLine) {
        await syncDown();
        await syncUp();
      } else {
        document.getElementById('syncStatusText').innerText = "You are currently offline.";
      }
    }

    // ==========================================
    // 5. SMART AUTO-SYNC TRIGGERS (Highly Efficient)
    // ==========================================

    // Trigger 1: Syncs ONLY when the user switches to the app tab or unlocks their phone
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && navigator.onLine) {
        document.getElementById('syncStatusText').innerText = "Welcome back! Checking for updates...";
        syncDown();
        syncUp();
      }
    });

    // Trigger 2: Syncs the exact moment the device connects back to Wi-Fi/Cellular
    window.addEventListener("online", () => {
        document.getElementById('syncStatusText').innerText = "Connection restored! Syncing...";
        syncDown();
        syncUp();
    });

  </script>
</body>
</html>
