<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Enterprise PWA Sync</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: Arial; background: #f4f7f6; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { background: #4285F4; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; }
    .action-btn { width: auto; padding: 6px 10px; font-size: 12px; margin-left: 5px; }
    .edit-btn { background: #f4b400; }
    .del-btn { background: #db4437; }
    #syncStatusText { margin-top: 15px; font-size: 14px; color: #555; text-align: center; font-weight: bold; }
    #notesList { margin-top: 20px; width: 100%; max-height: 400px; overflow-y: auto; }
    .note-item { background: #eef2f5; padding: 10px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;}
    .note-content { flex-grow: 1; word-break: break-word; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Advanced Notes</h2>
    <input type="hidden" id="editId">
    <input type="text" id="noteInput" placeholder="Type a note...">
    <button onclick="handleSave()" id="saveBtn">Save Note</button>
    <button onclick="syncData()" style="background: transparent; color: #4285F4; border: 1px solid #4285F4; margin-top: 10px;">🔄 Force Sync</button>
    
    <div id="syncStatusText">Initializing...</div>
    <div id="notesList"></div>
  </div>

  <script>
    // ==========================================
    // !!! PASTE YOUR NEW APPS SCRIPT URL HERE !!!
    // ==========================================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzQC5VFVpxV5spw583B__lb9U01_WZmedEspxGY6iopYJKspVsi5NajLLv6vQQg-USl/exec";

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

    // MUTEX & THROTTLE FLAGS
    let isSyncing = false;
    let lastSyncTime = 0;

    // ==========================================
    // 1. INDEXED-DB SETUP (v4 Schema with Metadata)
    // ==========================================
    let db;
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("GasAppDatabase", 4);
        request.onupgradeneeded = function(event) {
          const database = event.target.result;
          
          // Notes Store
          if (!database.objectStoreNames.contains("notes")) {
            const store = database.createObjectStore("notes", { keyPath: "id" });
            store.createIndex("syncStatus", "syncStatus", { unique: false });
          }
          
          // New Metadata Store (For Cursor)
          if (!database.objectStoreNames.contains("metadata")) {
            database.createObjectStore("metadata", { keyPath: "key" });
          }
        };
        request.onsuccess = e => { db = e.target.result; resolve(); };
        request.onerror = e => reject("IndexedDB Error");
      });
    }

    // Helper Functions for IDB
    function idbStore(mode) {
      return db.transaction(["notes"], mode).objectStore("notes");
    }
    
    function getCursor() {
      return new Promise(res => {
        const tx = db.transaction(["metadata"], "readonly");
        const req = tx.objectStore("metadata").get("cloudCursor");
        req.onsuccess = () => res(req.result ? req.result.value : 0);
      });
    }

    function setCursor(val) {
      return new Promise(res => {
        const tx = db.transaction(["metadata"], "readwrite");
        tx.objectStore("metadata").put({ key: "cloudCursor", value: val });
        tx.oncomplete = res;
      });
    }

    // ==========================================
    // 2. CRUD OPERATIONS
    // ==========================================
    window.onload = async () => {
      await initDB();
      await renderNotes(); 
      syncData(); 
    };

    async function handleSave() {
      const input = document.getElementById('noteInput');
      const editId = document.getElementById('editId').value;
      const text = input.value.trim();
      if (!text) return;

      const now = Date.now();
      let note;

      if (editId) {
        note = await new Promise(res => {
          const req = idbStore("readonly").get(editId);
          req.onsuccess = () => res(req.result);
        });
        note.text = text;
        note.updatedAt = now;
        note.syncStatus = 0;
      } else {
        note = {
          id: now.toString(36) + '-' + Math.random().toString(36).substring(2, 9),
          text: text,
          createdAt: now,
          updatedAt: now,
          deleted: false,
          syncStatus: 0
        };
      }

      await new Promise(res => {
        const req = idbStore("readwrite").put(note);
        req.onsuccess = res;
      });

      input.value = "";
      document.getElementById('editId').value = "";
      document.getElementById('saveBtn').innerText = "Save Note";
      
      await renderNotes();
      syncData(); 
    }

    function triggerEdit(id, text) {
      document.getElementById('noteInput').value = text;
      document.getElementById('editId').value = id;
      document.getElementById('saveBtn').innerText = "Update Note";
    }

    async function triggerDelete(id) {
      if(!confirm("Delete this note?")) return;
      const note = await new Promise(res => {
        const req = idbStore("readonly").get(id);
        req.onsuccess = () => res(req.result);
      });
      note.deleted = true;
      note.updatedAt = Date.now();
      note.syncStatus = 0;

      await new Promise(res => {
        const req = idbStore("readwrite").put(note);
        req.onsuccess = res;
      });

      await renderNotes();
      syncData();
    }

    async function renderNotes() {
      const notes = await new Promise(res => {
        const req = idbStore("readonly").getAll();
        req.onsuccess = () => res(req.result);
      });
      
      notes.sort((a, b) => b.updatedAt - a.updatedAt); 
      const listElement = document.getElementById('notesList');
      
      listElement.innerHTML = notes
        .filter(n => !n.deleted) 
        .map(note => `
        <div class="note-item">
          <div class="note-content">${note.text} <br>
             <span style="font-size: 10px; color: gray;">${note.syncStatus === 1 ? '☁️ Synced' : '⏳ Pending'}</span>
          </div>
          <div>
            <button class="action-btn edit-btn" onclick="triggerEdit('${note.id}', '${note.text.replace(/'/g, "\\'")}')">Edit</button>
            <button class="action-btn del-btn" onclick="triggerDelete('${note.id}')">X</button>
          </div>
        </div>
      `).join('');
    }

    // ==========================================
    // 3. UNIFIED DELTA SYNC ENGINE (With Mutex)
    // ==========================================
    async function syncData() {
      if (!navigator.onLine) {
        document.getElementById('syncStatusText').innerText = "Offline.";
        return;
      }
      
      // MUTEX CHECK
      if (isSyncing) return;
      isSyncing = true;

      document.getElementById('syncStatusText').innerText = "Syncing...";
      
      try {
        await syncUp();
        await syncDown();
        lastSyncTime = Date.now(); // Update throttle timer
      } finally {
        isSyncing = false; // RELEASE MUTEX
      }
    }

    async function syncUp() {
      const pendingNotes = await new Promise(res => {
        const tx = db.transaction("notes", "readonly");
        const index = tx.objectStore("notes").index("syncStatus");
        const req = index.getAll(IDBKeyRange.only(0));
        req.onsuccess = () => res(req.result);
      });

      if (pendingNotes.length === 0) return;

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(pendingNotes)
        });
        const result = await response.json();

        if (result.status === 'success') {
          const tx = db.transaction(["notes"], "readwrite");
          const store = tx.objectStore("notes");
          pendingNotes.forEach(note => {
            note.syncStatus = 1;
            store.put(note);
          });
          await new Promise(res => tx.oncomplete = res); 
        }
      } catch (error) {
        console.error("Sync Up Error", error);
      }
    }

    async function syncDown() {
      let cursor = await getCursor();

      try {
        const response = await fetch(`${WEB_APP_URL}?lastSync=${cursor}`);
        const result = await response.json();

        if (result.status === 'success' && result.data.length > 0) {
          
          // Fetch all local IDs first to avoid async operations inside the transaction loop
          const localData = await new Promise(res => {
            const req = idbStore("readonly").getAll();
            req.onsuccess = () => res(req.result);
          });
          const localMap = {};
          localData.forEach(n => localMap[n.id] = n);

          // Calculate final batch and advance cursor
          let highestNewTimestamp = cursor;
          const rowsToWrite = [];

          for (const serverNote of result.data) {
             const localNote = localMap[serverNote.id];
             // LWW (Last Write Wins) Conflict Resolution
             if (!localNote || serverNote.updatedAt > localNote.updatedAt) {
                rowsToWrite.push(serverNote);
             }
             if (serverNote.updatedAt > highestNewTimestamp) {
                highestNewTimestamp = serverNote.updatedAt;
             }
          }

          if (rowsToWrite.length > 0) {
            const tx = db.transaction(["notes"], "readwrite");
            const store = tx.objectStore("notes");
            rowsToWrite.forEach(note => store.put(note));
            
            // Advance cursor ONLY after transaction completes successfully
            await new Promise(res => tx.oncomplete = res);
          }
          
          await setCursor(highestNewTimestamp);
          document.getElementById('syncStatusText').innerText = "App is up to date.";
          renderNotes(); 
          
        } else {
          document.getElementById('syncStatusText').innerText = "App is up to date.";
          renderNotes(); 
        }
      } catch (error) {
         document.getElementById('syncStatusText').innerText = "Offline mode active.";
      }
    }

    // ==========================================
    // 4. OPTIMIZED TRIGGERS
    // ==========================================
    
    // 5-Minute Visibility Cooldown
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      const now = Date.now();
      if (now - lastSyncTime > 300000) { // 5 minutes
         syncData();
      }
    });
    
    window.addEventListener("online", syncData);

  </script>
</body>
</html>
